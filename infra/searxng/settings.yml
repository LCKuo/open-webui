use_default_settings:
  engines:
    keep_only:
      - bing
      - google
      - google cse

general:
  debug: false
  instance_name: "Interact private search"
  privacypolicy_url: false
  donation_url: false
  contact_url: false

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "zh-TW"
  formats:
    - html
    - json

server:
  limiter: false
  image_proxy: false
  method: "GET"

ui:
  static_use_hash: true

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 40
  pool_maxsize: 10

engines:
  - name: bing
    disabled: false
  - name: google
    disabled: false
  - name: google cse
    disabled: false
